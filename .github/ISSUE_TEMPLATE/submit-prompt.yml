name: "🎬 Submit a Gemini Omni Prompt"
description: "Share a high-quality Gemini Omni prompt with the community"
title: "[Prompt] "
labels: ["prompt-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a Gemini Omni prompt. Please include enough detail for others to reproduce the result.
  - type: input
    id: title
    attributes:
      label: Prompt Title
      description: "A short descriptive title."
      placeholder: "e.g., Magnifying Glass Physics"
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Full Prompt Text
      description: "The complete reusable prompt, if available."
      render: text
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - "Text-to-Video Generation"
        - "Video Editing / V2V"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL
      placeholder: "https://x.com/username/status/..."
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Original Author
      placeholder: "@username"
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Output / Reference Media
      description: "Paste links or upload screenshots/videos if GitHub allows."
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: "I credited the original author or I am the original author."
          required: true
